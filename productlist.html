<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Productlist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">

        <div class="logo_wrap">
            <img src="images/logo.png" class="logo" alt="logo">
            <p>Your style</p>
        </div>
        <button class="burger" aria-label="Åbn menu">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </button>


        <nav class="navbar">
            <ul>
                <li><a href="index.html" class="active">Frontpage</a></li>
                <li><a href="productlist.html">Products</a></li>
                <li><a href="basket.html">Basket</a></li>
            </ul>
        </nav>

    </header>

    <main class="productlist-page">

        <!-- HEADING -->
        <section class="productlist-header">
            <h1 id="category-title">Products</h1>

            <p>
                Check out our selection of clothing, shoes and accessories.
            </p>
        </section>
        <div class="btn_container">
            <button class="btn" data-filter="All">All</button>
            <button class="btn" data-filter="Men">Men</button>
            <button class="btn" data-filter="Women">Women</button>
            <button class="btn" data-filter="Unisex">Unisex</button>
        </div>

        <!-- PRODUCT LIST -->
        <section class="product_list_container">
            <!-- Produkterne fra API'et kommer ind her -->
        </section>

    </main>


    <footer class="footer">
        <div class="footer-grid">

            <div>
                <h3>Finding your way</h3>
                <ul>
                    <li><a href="index.html">Frontpage</a></li>
                    <li><a href="productlist.html">Productlist</a></li>
                    <li><a href="basket.html">Basket</a></li>
                </ul>
            </div>

            <div class="footer-social">
                <h4>FashionRus</h4>

                <div class="social-icons">
                    <a href="#" target="_blank">
                        <img src="images/face_logo.png" alt="Facebook">
                    </a>

                    <a href="#" target="_blank">
                        <img src="images/insta_logo.png" alt="Instagram">
                    </a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <img src="images/logo_beige.png" class="logo" alt="Logo">
            <p>© FashionRus 2026. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="productlist.js"></script>
</body>

</html>
